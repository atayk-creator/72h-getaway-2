name: Noel foto aday (tek seferlik)
on:
  push:
    branches: [main]
    paths: [.github/workflows/noel-foto.yml]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p img/aday
          for id in 1705056067460-64364b4e2a44 1577462281852-279bf4986f7b 1618923650230-90c39b7f67d0 1508086171957-7e2d64a75c6a 1745058185953-bc569d88e7b0 1568607689150-17e625c1586e 1536999606895-b6c1971676c4 1594279761639-cb1787798b52 1612176963909-3fdb62cdc67c 1638621030059-1483c62b3e01; do
            curl -sfL "https://images.unsplash.com/photo-$id?w=1600&q=80&fm=jpg&fit=max" -o img/aday/$id.jpg || echo "yok $id"
            curl -sfL "https://images.unsplash.com/photo-$id?w=640&q=75&fm=jpg&fit=max" -o img/aday/$id-640.jpg || true
          done
          ls -la img/aday
          git config user.name "otel-fiyat-robotu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/aday && git commit -m "Noel foto adayları" && git pull --rebase --autostash && git push
