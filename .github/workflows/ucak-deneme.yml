name: Uçak robotu denemesi (eiv, uçuş başına ücret)
# Tek seferlik karşılaştırma: scripts/ucak-deneme.mjs değişince çalışır, sonucu data/ucak-deneme.json'a yazar.
on:
  push:
    branches: [main]
    paths: [scripts/ucak-deneme.mjs]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apify-robotlari
  cancel-in-progress: false
jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deneme
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/ucak-deneme.mjs
      - name: Depoya kaydet
        if: always()
        run: |
          git config user.name "otel-fiyat-robotu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ucak-deneme.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Uçak robotu denemesi sonucu"
          git pull --rebase --autostash
          git push
