name: Tek seferlik arama
on:
  push:
    branches: [main]
    paths: [scripts/tek-arama.mjs]
permissions:
  contents: write
concurrency:
  group: apify-robotlari
  cancel-in-progress: false
jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/tek-arama.mjs
      - if: always()
        run: |
          git config user.name "otel-fiyat-robotu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tek-arama*.json img/sehir/ 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Tek seferlik arama sonucu (Linz yeniden planı)"
          git pull --rebase --autostash
          git push
