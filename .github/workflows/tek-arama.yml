name: Tek arama (geçici)
on:
  push:
    branches: [main]
    paths: [scripts/tek-arama.mjs]
permissions:
  contents: read
concurrency:
  group: apify-robotlari
  cancel-in-progress: false
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/tek-arama.mjs
