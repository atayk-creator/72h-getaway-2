name: Noel deneme (tek seferlik)
on:
  push:
    branches: [main]
    paths: [scripts/noel-deneme.mjs]
permissions:
  contents: write
concurrency:
  group: apify-robotlari
  cancel-in-progress: false
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/noel-deneme.mjs
      - run: |
          git config user.name "otel-fiyat-robotu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noel-deneme.json && git commit -m "Noel deneme sonucu" && git pull --rebase --autostash && git push
