name: Uçak fiyat robotu (İstanbul çıkışlı, Cuma sabah - Pazar akşam)
# Salı sabahı 06:17'de (İstanbul) çalışır. Ayarlar: data/ucus-ayarlari.json, sonuç: data/ucuslar.json.
# Ayar dosyası değişince en yakın 4 hafta sonunu hemen yeniden çeker (mod: yakin).
on:
  schedule:
    - cron: "17 3 * * 2"
  push:
    branches: [main]
    paths: [data/ucus-ayarlari.json]
  workflow_dispatch:
    inputs:
      mod:
        description: "test = sadece en yakın hafta sonu, yakin = en yakın 4 hafta sonu, takvim = bugünün planı, hepsi = 13 hafta sonunun hepsi"
        type: choice
        options: [test, yakin, takvim, hepsi]
        default: test
      sehir:
        description: "Sadece bu şehir(ler) (virgülle, örnek: Paris,Roma). Boş = hepsi"
        type: string
        default: ""
      toplu:
        description: "Toplu arama (1 = bir hafta sonunun tüm şehirleri tek çalışmada, 0 = tek tek, boş = ayardaki gibi)"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: apify-robotlari
  cancel-in-progress: false
jobs:
  ucuslar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testler
        run: node scripts/test-ucak-fiyatlari.mjs
      - name: Uçak fiyatlarını çek
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MOD: ${{ github.event.inputs.mod || (github.event_name == 'push' && 'yakin') || 'takvim' }}
          SEHIR: ${{ github.event.inputs.sehir || '' }}
          TOPLU: ${{ github.event.inputs.toplu || '' }}
        run: node scripts/ucak-fiyatlari.mjs
      - name: Sonuçları depoya kaydet
        if: always()
        run: |
          git config user.name "otel-fiyat-robotu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          git commit -m "Uçak fiyatları güncellendi ($(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M'))"
          git pull --rebase --autostash
          git push
