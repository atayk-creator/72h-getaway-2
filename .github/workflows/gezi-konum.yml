name: Gezi yerleri konum robotu (Google Maps)
# Elle çalışır: data/gezi.json'da konumu olmayan yerlerin konumunu Google Maps'ten bulur (~0,005 $/yer).
on:
  workflow_dispatch:
    inputs:
      sehir:
        description: "Sadece bu şehir(ler) (virgülle). Boş = hepsi"
        type: string
        default: ""
      hepsi:
        description: "1 = konumu olanları da yeniden ara"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: apify-robotlari
  cancel-in-progress: false
jobs:
  konum:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testler
        run: node scripts/test-gezi-konum.mjs
      - name: Konumları bul
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SEHIR: ${{ github.event.inputs.sehir || '' }}
          HEPSI: ${{ github.event.inputs.hepsi || '' }}
        run: node scripts/gezi-konum.mjs
      - name: Depoya kaydet
        if: always()
        run: |
          git config user.name "otel-fiyat-robotu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gezi.json
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          git commit -m "Gezi yerlerinin konumları güncellendi"
          git pull --rebase --autostash
          git push
