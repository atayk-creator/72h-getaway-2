name: Tek kontrol (geçici)
on:
  push:
    branches: [main]
    paths: [.github/workflows/tek-kontrol.yml]
permissions:
  contents: write
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: "data", ref: main }
      - run: |
          for p in / /deplasman/ /sehir/milano/ /yonetim/it-bekleyenler.md /magaza/KURULUM.md /README.md /scripts/denetci.mjs /data/apify-rapor.json /app/package.json /data.json /medya/README.md /sitemap.xml; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' "https://72hgetaway.com$p?k=$RANDOM") $p"
          done > data/yayin-kontrol.txt
          cat data/yayin-kontrol.txt
          git config user.name "otel-fiyat-robotu"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yayin-kontrol.txt && git commit -m "geçici yayın kontrolü" && for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep 10; done
