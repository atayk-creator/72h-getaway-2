name: Tek foto arama (geçici)
on:
  push:
    branches: [main]
    paths: [.github/workflows/tek-foto.yml]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-foto
          for x in koln-a:photo-1647956331844-6554eb7c629c koln-b:photo-1596969832010-09f775202118 lefkosa-a:photo-1685451024235-62d45a7e405d lefkosa-b:photo-1596993869045-024b958fbe7a; do
            n=${x%%:*}; id=${x##*:}
            curl -sfL -o tmp-foto/$n.jpg "https://images.unsplash.com/$id?fm=jpg&q=85&w=2000&fit=max" || echo "$n indirilemedi"
          done
          ls -la tmp-foto
          git config user.name "otel-fiyat-robotu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-foto && git commit -m "geçici foto adayları (Köln, Lefkoşa)" && for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep 10; done
