name: Tek foto arama (geçici)
on:
  push:
    branches: [main]
    paths: [.github/workflows/tek-foto.yml]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-foto
          for x in koln-a:od3SmFMCAR4 koln-b:BB2S2ZwOVpM lefkosa-a:u0E6aDpddEM lefkosa-b:VABDpI77JI0; do
            n=${x%%:*}; id=${x##*:}
            curl -sfL -A "Mozilla/5.0" -o tmp-foto/$n.jpg "https://unsplash.com/photos/$id/download?force=true&w=2000" || echo "$n indirilemedi"
          done
          ls -la tmp-foto
          git config user.name "otel-fiyat-robotu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-foto && git commit -m "geçici foto adayları (Köln, Lefkoşa)" && for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep 10; done
