name: Kur Bekçisi
# Her iş günü 19:10 (TR). ECB kuru 16:00 CET civarı yayınlar.
on:
  schedule:
    - cron: "10 16 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: depo-yazma
  cancel-in-progress: false
jobs:
  kur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testler
        run: node scripts/test-update-rates.mjs
      - name: Kuru güncelle
        run: node scripts/update-rates.mjs
      - name: Değiştiyse kaydet
        run: |
          git config user.name "72h-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && { echo "Değişiklik yok"; exit 0; }
          git commit -m "Kur Bekçisi: kur güncellendi"
          git pull --rebase origin main && git push
