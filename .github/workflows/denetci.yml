name: Denetçi (robot ve site sağlık kontrolü)
# Her gün 09:40'ta ve yedek olarak 18:13'te (İstanbul) robotların verilerini, iş akışlarını ve siteyi kontrol eder (scripts/denetci.mjs).
# Sorun varsa "denetci" etiketli tek bir issue açar ya da günceller; her şey yoluna girince yorum yazıp kapatır.
# Ücretli API kullanmaz.
on:
  schedule:
    - cron: "40 6 * * *"
    - cron: "13 15 * * *" # yedek: GitHub zamanlayıcısı gecikir ya da atlarsa (18:13 İstanbul)
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: denetci
  cancel-in-progress: false
jobs:
  denetle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Testler
        run: node scripts/test-denetci.mjs
      - name: Denetle
        id: denetci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DENETCI_RAPOR: ${{ runner.temp }}/denetci-rapor.md
        run: node scripts/denetci.mjs
      - name: Issue aç, güncelle ya da kapat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SORUN: ${{ steps.denetci.outputs.sorun }}
          RAPOR: ${{ runner.temp }}/denetci-rapor.md
        run: |
          set -euo pipefail
          num=$(gh issue list --label denetci --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$SORUN" = "1" ]; then
            # Yalnız "Sorunlar" bölümündeki madde satırları karşılaştırılır; yeni bir sorun çıktıysa yorum yazılır.
            # Yorumdaki bahsetme depo sahibine e-posta / GitHub mobil bildirimi gönderir (gövdeyi düzenlemek bildirim göndermez).
            sorunlar() { awk '/^## Sorunlar/{f=1;next} /^## /{f=0} f && /^ *- /' | sed 's/([^)]*UTC)//; s/[0-9]\{4\}-[0-9-]\{5\} [0-9:]\{5\}//g' | sort -u; }
            if [ -n "$num" ]; then
              gh issue view "$num" --json body --jq .body | sorunlar > "$RUNNER_TEMP/eski.txt" || true
              gh issue edit "$num" --body-file "$RAPOR"
              echo "Issue #$num güncellendi."
            else
              : > "$RUNNER_TEMP/eski.txt"
              gh label create denetci --color B60205 --description "Denetçi'nin bulduğu sorunlar" --force
              num=$(gh issue create --title "Denetçi: sorun var" --label denetci --body-file "$RAPOR" | grep -o '[0-9]*$')
            fi
            sorunlar < "$RAPOR" > "$RUNNER_TEMP/yeni.txt"
            comm -13 "$RUNNER_TEMP/eski.txt" "$RUNNER_TEMP/yeni.txt" > "$RUNNER_TEMP/fark.txt" || true
            if [ -s "$RUNNER_TEMP/fark.txt" ]; then
              { echo "@${{ github.repository_owner }} Denetçi yeni sorun buldu:"; echo; cat "$RUNNER_TEMP/fark.txt"; echo; echo "Ayrıntılar kaydın açıklamasında."; } > "$RUNNER_TEMP/yorum.md"
              gh issue comment "$num" --body-file "$RUNNER_TEMP/yorum.md"
            fi
          elif [ -n "$num" ]; then
            gh issue comment "$num" --body "Denetçi $(date -u '+%Y-%m-%d %H:%M') UTC kontrolünde sorun bulmadı, kayıt kapatılıyor."
            gh issue close "$num"
          else
            echo "Sorun yok."
          fi
