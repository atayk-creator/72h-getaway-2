name: Otel fiyat robotu (Cuma-Pazar fiyatları)
# Pazartesi, Çarşamba, Perşembe ve Cuma sabahı 06:17'de (İstanbul) çalışır.
# Hangi gün hangi hafta sonlarına bakılacağını data/hotels.json'daki takvim belirler.
on:
  schedule:
    - cron: "17 3 * * 1,3,4,5"
  workflow_dispatch:
    inputs:
      mod:
        description: "test = sadece en yakın hafta sonu (ucuz deneme), takvim = bugünün planı, hepsi = 26 hafta sonunun hepsi"
        type: choice
        options: [test, takvim, hepsi]
        default: test
permissions:
  contents: write
concurrency:
  group: otel-fiyatlari
  cancel-in-progress: false
jobs:
  fiyatlar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testler
        run: node scripts/test-otel-fiyatlari.mjs
      - name: Fiyatları çek
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MOD: ${{ github.event.inputs.mod || 'takvim' }}
        run: node scripts/otel-fiyatlari.mjs
      - name: Sonuçları depoya kaydet
        run: |
          git config user.name "otel-fiyat-robotu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          git commit -m "Otel fiyatları güncellendi ($(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M'))"
          git pull --rebase --autostash
          git push
