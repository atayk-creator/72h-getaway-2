name: Yönetici paneli
# Şifreli yönetici panelini (panel/index.html) saatte bir yeniler. İş emri: yonetim/is-emri-yonetici-paneli.md
# Depo herkese açık: düz veri, şifre ve anahtarlar hiçbir dosyaya ya da loga yazılmaz; yalnızca şifreli sayfa commit edilir.
# Secrets (Atay girer): PANEL_SIFRE, METRICOOL_TOKEN, METRICOOL_USER_ID, PANEL_NOT_ANAHTARI.
# PANEL_SIFRE yoksa iş akışı panel üretmeden, hata vermeden biter.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: ["scripts/panel*.mjs", "yonetim/panel/**", ".github/workflows/panel.yml"]
  workflow_dispatch:
    inputs:
      tanilama:
        description: "Metricool sorgularının durumunu ve alan adlarını loga yaz (değer yazılmaz)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: panel
  cancel-in-progress: false
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: |
            scripts
            yonetim/panel
            panel
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Paneli üret ve şifrele
        env:
          PANEL_SIFRE: ${{ secrets.PANEL_SIFRE }}
          METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          PANEL_NOT_ANAHTARI: ${{ secrets.PANEL_NOT_ANAHTARI }}
          PANEL_TANILAMA: ${{ inputs.tanilama && '1' || '' }}
        run: node scripts/panel-uret.mjs
      - name: Şifreli sayfayı kaydet
        run: |
          git add panel/index.html 2>/dev/null || true
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          git config user.name "panel-robotu"
          git config user.email "actions@users.noreply.github.com"
          git commit -q -m "Panel yenilendi"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          echo "::warning::Panel kaydedilemedi (push çakışması); bir sonraki saatte yeniden denenecek."
