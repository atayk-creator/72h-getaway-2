name: Kur güncelle (Euro/TL, Euro/Forint)
# Günde 1 kez, sabah 10:00'dan hemen önce (İstanbul 09:53; Atay'ın kararı, 16 Kas 2026; önceden günde 4 kezdi).
# İş günlerinde ECB'nin bir önceki akşam yayımladığı referans kuru; ECB'nin kur yayımlamadığı hafta sonu ve
# tatillerde günlük piyasa orta kuru kullanılır, böylece kur her gün yenilenir.
on:
  schedule:
    - cron: "53 6 * * *"
  push:
    branches: [main]
    paths: [scripts/update-rates.mjs]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kur-guncelle
  cancel-in-progress: false
jobs:
  kur:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Testler
        run: node scripts/test-update-rates.mjs
      - name: Kuru çek
        run: node scripts/update-rates.mjs
      - name: Depoya kaydet
        run: |
          git config user.name "kur-robotu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          git commit -m "Kur güncellendi ($(node -p "const d=require('./data.json'); d.updated+': 1 EUR = '+d.eurTry+' TL'"))"
          git pull --rebase --autostash
          git push
