name: Restoran robotu denemesi (Google Maps)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Google Maps denemesi
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/restoran-deneme.mjs
      - name: Ham sonucu depoya kaydet
        if: always()
        run: |
          git config user.name "otel-fiyat-robotu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/deneme
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restoran robotu deneme sonucu"
          git pull --rebase --autostash
          git push
