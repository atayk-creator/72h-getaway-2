name: Maç gezisi fiyatları (tek seferlik)
# scripts/mac-gezisi.mjs değişince çalışır. Fenerbahçe deplasmanları için otel + uçak fiyatı (~0,15 $).
on:
  push:
    branches: [main]
    paths: [scripts/mac-gezisi.mjs]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apify-robotlari
  cancel-in-progress: false
jobs:
  fiyat:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fiyatları çek
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/mac-gezisi.mjs
      - name: Depoya kaydet
        if: always()
        run: |
          git config user.name "otel-fiyat-robotu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mac-gezisi*.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Maç gezisi fiyatları"
          git pull --rebase --autostash
          git push
