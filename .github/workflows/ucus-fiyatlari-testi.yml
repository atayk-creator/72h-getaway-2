name: Uçuş fiyatları testi (İstanbul - Budapeşte, Paris)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testler
        run: node scripts/test-ucus-fiyatlari.mjs
      - name: Aviasales veri API'sinden fiyatları çek
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: node scripts/ucus-fiyatlari.mjs
      - name: Sonucu indirilebilir yap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucus-fiyatlari
          path: |
            ucus-fiyatlari.json
            ucus-ozet.md
          if-no-files-found: ignore
