name: Tek medya (geçici)
on:
  push:
    branches: [main]
    paths: [.github/workflows/tek-medya.yml]
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-medya
          curl -sfL -o tmp-medya/0-londra.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3LmFwKLlCAL9Pu1UYo5IVfvl4cN/hf_20261110_163638_42cea6e5-91c1-4ffb-a047-b11d9aa256cd.mp4"
          curl -sfL -o tmp-medya/1-linz.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3LmFwKLlCAL9Pu1UYo5IVfvl4cN/hf_20261110_163641_fe7ed852-164f-4fab-af92-5f5cce4bacee.mp4"
          curl -sfL -o tmp-medya/2-madrid.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3LmFwKLlCAL9Pu1UYo5IVfvl4cN/hf_20261110_163640_244d2504-86c5-4689-b0f7-232533174661.mp4"
          curl -sfL -o tmp-medya/3-atina.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3LmFwKLlCAL9Pu1UYo5IVfvl4cN/hf_20261110_163638_36a11bb0-44ef-4104-ac49-4d94e08a3e97.mp4"
          curl -sfL -o tmp-medya/4-paris.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3LmFwKLlCAL9Pu1UYo5IVfvl4cN/hf_20261110_163638_9a9893ab-4566-45f5-a3a7-664d885b6c64.mp4"
          curl -sfL -o tmp-medya/5-koln.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3LmFwKLlCAL9Pu1UYo5IVfvl4cN/hf_20261110_163637_815da284-6d6d-4913-8869-ac8084704899.mp4"
          curl -sfL -o tmp-medya/6-lefkosa.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3LmFwKLlCAL9Pu1UYo5IVfvl4cN/hf_20261110_163638_2e114a57-b7cc-4e05-854e-a85352a64c75.mp4"
          ls -la tmp-medya
          git config user.name "otel-fiyat-robotu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-medya && git commit -m "geçici medya (video)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep 10; done
